name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.98.0-07); created from the selected ref if missing'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -Denforcer.skip=true clean verify

      - name: Collect release files
        id: files
        run: |
          set -euo pipefail
          jars=$(find target -maxdepth 1 -name 'nexus3-github-oauth-plugin-*.jar' ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          [ "$(echo "$jars" | wc -l)" -eq 1 ] || { echo "Expected exactly one plugin jar, got:"; echo "$jars"; exit 1; }
          mkdir dist
          cp "$jars" scripts/install-nexus-plugin.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)
          echo "jar=$(basename "$jars")" >> "$GITHUB_OUTPUT"

      - name: Render release notes
        run: |
          sed -e "s|@VERSION@|${TAG#v}|g" \
              -e "s|@JAR@|${{ steps.files.outputs.jar }}|g" \
              -e "s|@REPO@|${{ github.repository }}|g" \
              -e "s|@TAG@|${TAG}|g" \
              .github/release-notes.md.tpl > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
